[project]
name = "dj-stripe"
version = "2.11.0"
description = "Django + Stripe made easy"
license = "MIT"
authors = [
    { name = "Alexander Kavanaugh", email = "alex@kavdev.io" },
    { name = "Jerome Leclanche", email = "jerome@leclan.ch" },
    { name = "Abe Hanoka", email = "abe@habet.dev" },
]
readme = "docs/README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "django>=5.2",
    "stripe>=15.0.1,<16",
]

[project.optional-dependencies]
postgres = ["psycopg>=3.3.4,<4"]
mysql = ["mysqlclient>=2.2.0"]

[project.urls]
Homepage = "https://dj-stripe.dev"
Repository = "https://github.com/dj-stripe/dj-stripe"
Documentation = "https://dj-stripe.dev/dj-stripe/"
Funding = "https://github.com/sponsors/dj-stripe"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.5,<7",
    "mypy>=2.1.0,<3",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.1.1,<10",
    "pytest-django>=4.12.0,<5",
    "pytest-dotenv>=0.5.2,<0.6",
    "ruff>=0.16.2,<0.18",
]
ci = [
    "coverage[toml]>=7.14.1,<8",
    "tox>=4.58.0,<5",
    "tox-gh>=1.8.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djstripe"]

[tool.hatch.build.targets.sdist]
include = [
    "/djstripe",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.ruff.lint]
select = [
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "E4",    # pycodestyle: imports
    "E7",    # pycodestyle: statements
    "E9",    # pycodestyle: runtime errors
    "F",     # pyflakes
    "FURB",  # refurb
    "I",     # isort — import sorting is enforced here, not by a separate hook
    "PIE",   # flake8-pie
    "RUF100",  # unused noqa directives
    "UP",    # pyupgrade — supersedes the standalone pyupgrade hook
    "W",     # pycodestyle warnings
    # The remaining flake8-return rules (RET501/503/504) are deliberately not
    # enabled; they fight with the explicit-return style used in the models.
    "RET502",
    "RET505",
    "RET506",
    "RET507",
]
# E501 is intentionally absent: line length is the formatter's job.

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true

# The admin, management command and migration modules lean heavily on Django's
# dynamic runtime behaviour, which django-stubs cannot model without a large
# number of ignores. Type checking is enforced on the core model layer only.
[[tool.mypy.overrides]]
module = [
    "djstripe.admin.*",
    "djstripe.management.*",
    "djstripe.migrations.*",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
markers = ["stripe_api: mark a test as using Stripe API."]
env_files = [".env"]

[tool.coverage.run]
branch = true
source = ["djstripe"]
omit = [
    "djstripe/migrations/*",
    "djstripe/management/*",
    "djstripe/admin.py",
    "djstripe/checks.py",
]

[tool.coverage.html]
directory = "cover"
